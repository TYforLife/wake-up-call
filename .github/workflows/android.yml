name: android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Per-branch: a new push cancels that branch's older run, never another branch's tests.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew :engine:test :app:testDebugUnitTest :app:assembleDebug --console=plain
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GIT_SHA: ${{ github.sha }}
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One rolling prerelease: only one publish at a time, the newest push wins.
    concurrency:
      group: debug-release
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
      - name: Publish to the debug-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NOTES="Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA::7} (${GITHUB_SHA})
          Build: ${GITHUB_RUN_NUMBER}
          Run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}

          Install: ${GITHUB_SERVER_URL}/${REPO}/releases/download/debug-latest/app-debug.apk"
          if ! gh release view debug-latest --repo "$REPO" > /dev/null 2>&1; then
            gh release create debug-latest --repo "$REPO" --prerelease \
              --title "Debug build (latest push)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload debug-latest app-debug.apk --repo "$REPO" --clobber
          gh release edit debug-latest --repo "$REPO" --prerelease --notes "$NOTES"
