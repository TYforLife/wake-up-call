name: android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Per-branch: a new push cancels that branch's older run, never another branch's tests.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Stop index script matches its fixture (PLAN Run 12)
        run: |
          python3 tools/gtfs_index.py --dir tools/testdata/gtfs --out build/gtfs-fixture
          diff -r build/gtfs-fixture app/src/test/resources/gtfs
      - name: Auckland Transport stops and routes (public GTFS, bundled offline; PLAN Run 12)
        id: gtfs
        continue-on-error: true
        run: |
          python3 tools/gtfs_index.py --out app/src/main/assets/gtfs
          cat app/src/main/assets/gtfs/meta.txt >> "$GITHUB_STEP_SUMMARY"
      # Fetched once per version of the queries and kept, so a busy Overpass never blocks a build and every run
      # tests the same map; a new query fetches again.
      - name: Footpaths fetched before, for these queries
        id: footpaths
        uses: actions/cache/restore@v4
        with:
          path: app/build/footpaths
          key: footpaths-${{ hashFiles('.github/workflows/android.yml', 'tools/walk_reference.py') }}
      - name: OpenStreetMap footpaths and a foot router's walks around public places (BACKLOG 27; RealWalkTest needs them)
        if: steps.footpaths.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/build/footpaths
          # The app's own queries (WalkGraphTest checks they match WalkGraph.query), around two public places.
          q_hospital='[out:json][timeout:25];(way["highway"]["highway"!~"^(motorway|motorway_link|trunk|trunk_link|construction|proposed|bus_guideway|busway|raceway|corridor)$"]["foot"!~"^(no|private)$"]["access"!~"^(no|private)$"](-36.87313,174.75342,-36.84707,174.78598);way["highway"~"^(trunk|trunk_link)$"]["foot"!~"^(no|private|use_sidepath)$"]["access"!~"^(no|private)$"]["motorroad"!="yes"]["sidewalk"!~"^(no|none|separate)$"](-36.87313,174.75342,-36.84707,174.78598);)->.w;(.w;>;);out skel qt;way.w["area"="yes"];out ids qt;node(w.w)["barrier"]["access"~"^(no|private)$"]["foot"!~"^(yes|designated|permissive)$"];out ids qt;node(w.w)["barrier"]["foot"~"^(no|private)$"];out ids qt;node(w.w)["barrier"]["locked"="yes"];out ids qt;'
          q_britomart='[out:json][timeout:25];(way["highway"]["highway"!~"^(motorway|motorway_link|trunk|trunk_link|construction|proposed|bus_guideway|busway|raceway|corridor)$"]["foot"!~"^(no|private)$"]["access"!~"^(no|private)$"](-36.85723,174.75132,-36.83117,174.78388);way["highway"~"^(trunk|trunk_link)$"]["foot"!~"^(no|private|use_sidepath)$"]["access"!~"^(no|private)$"]["motorroad"!="yes"]["sidewalk"!~"^(no|none|separate)$"](-36.85723,174.75132,-36.83117,174.78388);)->.w;(.w;>;);out skel qt;way.w["area"="yes"];out ids qt;node(w.w)["barrier"]["access"~"^(no|private)$"]["foot"!~"^(yes|designated|permissive)$"];out ids qt;node(w.w)["barrier"]["foot"~"^(no|private)$"];out ids qt;node(w.w)["barrier"]["locked"="yes"];out ids qt;'
          # Each server the app uses, three rounds; a refusal (HTML, or a "remark") is not footpaths.
          fetch() {
            for round in 1 2 3; do
              for s in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
                if curl -sS -m 120 -A "Nodstop-CI" --data-urlencode "data=$1" "$s" -o "$2" && grep -q '"way"' "$2" && ! grep -q '"remark"' "$2"; then
                  echo "$2: $(stat -c %s "$2") bytes from $s"; return 0
                fi
                echo "$2: no footpaths from $s"; head -c 300 "$2" 2>/dev/null; echo
              done
              sleep $((round * 30))
            done
            return 1
          }
          fetch "$q_hospital" app/build/footpaths/hospital.json
          fetch "$q_britomart" app/build/footpaths/britomart.json
          if [ -f app/src/main/assets/gtfs/stops.tsv ]; then
            python3 tools/walk_reference.py --stops app/src/main/assets/gtfs/stops.tsv --out app/build/footpaths
          fi
      - name: Keep the footpaths for the next runs
        if: steps.footpaths.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/build/footpaths
          key: footpaths-${{ hashFiles('.github/workflows/android.yml', 'tools/walk_reference.py') }}
      - name: Test and build
        run: ./gradlew :engine:test :brief:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --console=plain
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GIT_SHA: ${{ github.sha }}
      - name: Trip planner on the real timetable (PLAN Run 13; prints sizes and timings)
        if: always()
        run: |
          f=app/build/test-results/testDebugUnitTest/TEST-app.nodstop.data.RealTimetableTest.xml
          if [ -f "$f" ]; then sed -n '/<system-out>/,/<\/system-out>/p' "$f"; else echo "no planner results"; fi
          f=app/build/test-results/testDebugUnitTest/TEST-app.nodstop.data.RealWalkTest.xml
          if [ -f "$f" ]; then sed -n '/<system-out>/,/<\/system-out>/p' "$f"; else echo "no walking results"; fi
          python3 tools/walk_reference.py --explain app/build/footpaths/disagree.tsv || true
      - name: Ring path on the JVM (PLAN Run 10, A2; a failure blocks the merge)
        run: ./gradlew :app:testDebugUnitTest -Pscreenshots --tests '*RingPathTest' --console=plain
      - name: Screenshots (PLAN U0; never blocks the APK)
        id: shots
        continue-on-error: true
        run: ./gradlew :app:recordRoborazziDebug -Pscreenshots --tests '*ScreenshotTest' --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/src/test/snapshots/*.png
          if-no-files-found: ignore
      - name: Compare with the design (PLAN Runs 8 and 9; never blocks the APK)
        continue-on-error: true
        run: |
          pip install --quiet pillow
          python3 docs/design/compare.py app/src/test/snapshots build/compare
          cat build/compare/index.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare
          path: build/compare/*.png
          if-no-files-found: ignore
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            app/build/reports/lint-results-debug.html
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One rolling prerelease: only one publish at a time, the newest push wins.
    concurrency:
      group: debug-release
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: screenshots
          path: screenshots
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: compare
          path: compare
      - name: Publish to the debug-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NOTES="Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA::7} (${GITHUB_SHA})
          Build: ${GITHUB_RUN_NUMBER}
          Run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}

          Install: ${GITHUB_SERVER_URL}/${REPO}/releases/download/debug-latest/app-debug.apk"
          if ! gh release view debug-latest --repo "$REPO" > /dev/null 2>&1; then
            gh release create debug-latest --repo "$REPO" --prerelease \
              --title "Debug build (latest push)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload debug-latest app-debug.apk --repo "$REPO" --clobber
          # Screenshots of the screens (PLAN U0), viewable on a phone from the release page.
          if ls screenshots/*.png > /dev/null 2>&1; then
            gh release upload debug-latest screenshots/*.png --repo "$REPO" --clobber
          fi
          # Design next to app, per screen (PLAN Runs 8 and 9).
          if ls compare/*.png > /dev/null 2>&1; then
            gh release upload debug-latest compare/*.png --repo "$REPO" --clobber
          fi
          gh release edit debug-latest --repo "$REPO" --prerelease --notes "$NOTES"
