name: android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Per-branch: a new push cancels that branch's older run, never another branch's tests.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew :engine:test :brief:test :app:testDebugUnitTest :app:assembleDebug --console=plain
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GIT_SHA: ${{ github.sha }}
      - name: Screenshots (PLAN U0; never blocks the APK)
        id: shots
        continue-on-error: true
        run: ./gradlew :app:recordRoborazziDebug -Pscreenshots --tests '*ScreenshotTest' --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/src/test/snapshots/*.png
          if-no-files-found: ignore
      - name: Compare with the design (PLAN Runs 8 and 9; never blocks the APK)
        continue-on-error: true
        run: |
          pip install --quiet pillow
          python3 docs/design/compare.py app/src/test/snapshots build/compare
          cat build/compare/index.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare
          path: build/compare/*.png
          if-no-files-found: ignore
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One rolling prerelease: only one publish at a time, the newest push wins.
    concurrency:
      group: debug-release
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: screenshots
          path: screenshots
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: compare
          path: compare
      - name: Publish to the debug-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NOTES="Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA::7} (${GITHUB_SHA})
          Build: ${GITHUB_RUN_NUMBER}
          Run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}

          Install: ${GITHUB_SERVER_URL}/${REPO}/releases/download/debug-latest/app-debug.apk"
          if ! gh release view debug-latest --repo "$REPO" > /dev/null 2>&1; then
            gh release create debug-latest --repo "$REPO" --prerelease \
              --title "Debug build (latest push)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload debug-latest app-debug.apk --repo "$REPO" --clobber
          # Screenshots of the screens (PLAN U0), viewable on a phone from the release page.
          if ls screenshots/*.png > /dev/null 2>&1; then
            gh release upload debug-latest screenshots/*.png --repo "$REPO" --clobber
          fi
          # Design next to app, per screen (PLAN Runs 8 and 9).
          if ls compare/*.png > /dev/null 2>&1; then
            gh release upload debug-latest compare/*.png --repo "$REPO" --clobber
          fi
          gh release edit debug-latest --repo "$REPO" --prerelease --notes "$NOTES"
