<!doctype html>
<html>
<head><meta charset="utf-8"><title>ZoneSheet</title></head>
<body>
<div class="ns-phone"><div class="ns-sheet">
  <div class="ns-muted">Circle · Harbour St</div>
  <span class="ns-big">250 m</span>
  <div class="ns-muted">Rings as soon as the bus is inside it, or earlier by the usual timing.</div>
  <div class="ns-row"><span class="ns-chip">Auto</span><span class="ns-chip">150</span><span class="ns-chip is-on">250</span><span class="ns-chip">400</span><span class="ns-chip">700</span></div>
  <div class="ns-slider"><i style="width:30%"></i><b style="left:calc(30% - 14px)"></b></div>
  <div class="ns-scale"><span>50 m</span><span>500 m</span><span>2 km</span></div>
  <div class="ns-row" style="flex-wrap:nowrap"><button class="ns-btn ns-btn-secondary" style="flex:1">Cancel</button><button class="ns-btn ns-btn-primary" style="flex:1;min-height:var(--tap-min)">Save</button></div>
</div></div>
</body>
</html>
