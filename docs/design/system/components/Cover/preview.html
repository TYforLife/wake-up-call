<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Cover</title>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--bg); }
  .art { position: absolute; left: 480px; top: 0; width: 480px; height: 288px; }
  .ink { fill: var(--fg); }
  .paper { fill: var(--fill); }
  .live { fill: var(--accent); }
  .route { stroke: var(--fg); stroke-width: 6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ring { fill: none; stroke: var(--fg); stroke-opacity: .3; stroke-width: 2; }
  .hole { fill: var(--bg); }
  .text { position: absolute; left: 32px; bottom: 32px; max-width: 440px; }
  .name { font-family: var(--font-sans); font-weight: 700; font-size: 96px; line-height: .92; letter-spacing: -0.03em; color: var(--fg); }
  .tag { font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--muted); margin-top: 12px; }
</style></head>
<body>
<div class="cover">
  <svg class="art" viewBox="0 0 480 288" aria-hidden="true">
    <!-- blocks: fill slab 240x288 (radius-sheet corners), fg disc for the stop, accent dot for the live trip
         arrangement: one quiet slab with the route crossing it, as a map behind a sheet
         pattern: the literal motif, a route on a street grid ending in a stop with its circle; chosen because the whole product is that one picture
         steps and radii: space-6 (24) grid pitch for the route's turns; radius-sheet (24) on the slab; the circle at 3x space-6 -->
    <rect class="paper" x="240" y="-24" width="264" height="336" rx="24"/>
    <polyline class="route" points="96,264 96,168 264,168 264,96 360,96"/>
    <circle class="ring" cx="360" cy="96" r="72"/>
    <circle class="ink" cx="360" cy="96" r="14"/><circle class="hole" cx="360" cy="96" r="5"/>
    <circle class="live" cx="96" cy="264" r="10"/>
  </svg>
  <div class="text">
    <div class="name">Nodstop</div>
    <div class="tag">Sleep on the bus. It wakes you before your stop.</div>
  </div>
</div>
</body>
</html>
