<!-- @dsCard group="Riding" height=420 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>RideCard</title></head>
<body>
<div class="ns-phone">
  <div class="ns-card is-live">
    <span class="ns-status ns-armed" style="align-self:flex-start">Armed</span>
    <div><div class="ns-muted">Get off at · Bus 2 of 2</div><p class="ns-stop">Harbour St</p></div>
    <div class="ns-stats"><div class="ns-stat"><span class="ns-big">2.3 km</span><small>along the route</small></div><div class="ns-stat"><span class="ns-big">6 min</span><small>about</small></div></div>
    <div class="ns-track"><i style="width:68%"></i></div>
    <div class="ns-muted">Rings about 07:45, 45 s before the stop</div>
  </div>
  <div class="ns-card">
    <span class="ns-status ns-backup" style="align-self:flex-start">Backup alarm · GPS lost 40 s ago</span>
    <div><div class="ns-muted">Get off at · Bus 1 of 2</div><p class="ns-stop">Central Station</p></div>
    <div class="ns-stats"><div class="ns-stat"><span class="ns-big" style="color:var(--ink-muted)">4.1 km</span><small>40 s ago</small></div></div>
    <div class="ns-muted">Rings by 07:31 at the latest, even with no GPS</div>
  </div>
</div>
</body>
</html>
